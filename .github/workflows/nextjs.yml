name: Deploy React site to Pages (Bun)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Project
        run: bun run build
        # Catatan: Sesuaikan script build di package.json Anda (biasanya "vite build" atau "react-scripts build")

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist 
          # Ubah path di atas sesuai folder hasil build framework React Anda:
          # - Vite: ./dist
          # - Create React App: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
